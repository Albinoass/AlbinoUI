name: Validate and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Static checks and mocked API tests
        run: python3 tools/check.py
      - name: Build installable addon
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: AlbinoUI
          path: |
            dist/AlbinoUI.zip
            dist/SHA256SUMS
